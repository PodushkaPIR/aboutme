services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"
      - "8443:443/udp"
    environment:
      SITE_ROOT: /srv
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
