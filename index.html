<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodushkaPIR — Проекты и обо мне</title>
  <meta name="description" content="Персональный сайт: проекты с GitHub и немного обо мне.">
  <meta property="og:title" content="PodushkaPIR">
  <meta property="og:description" content="Проекты с GitHub и немного обо мне.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo">Podushka<span>PIR</span></a>
      <nav class="nav">
        <a href="#projects" data-i18n="nav_projects">Проекты</a>
        <a href="#about" data-i18n="nav_about">Обо мне</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="hero-greeting" data-i18n="hero_greeting">Привет, я</p>
        <h1 class="hero-name">PodushkaPIR</h1>
        <p class="hero-bio" data-i18n="hero_bio"></p>
        <div class="hero-links">
          <a class="btn btn-primary" href="https://github.com/PodushkaPIR" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            GitHub
          </a>
          <a class="btn" href="#projects" data-i18n="hero_cta">Мои проекты</a>
        </div>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="container">
        <h2 class="section-title" data-i18n="projects_title">Проекты</h2>
        <p class="section-subtitle" data-i18n="projects_subtitle">Актуальные репозитории с GitHub</p>
        <div id="projects-grid" class="grid" aria-live="polite"></div>
      </div>
    </section>

    <section id="about" class="section section-alt">
      <div class="container">
        <h2 class="section-title" data-i18n="about_title">Обо мне</h2>
        <div class="about-content">
          <p data-i18n="about_p1"></p>
          <p data-i18n="about_p2"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span data-i18n="footer_text">Сделано с душой</span>
      <span class="footer-copy">© <span id="year"></span> PodushkaPIR</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
